name: Update from project template

on:
  schedule:
    - cron: "15 0 1 * *"
  push:
    branches:
    - main
    paths:
    - '.hummingbird-project-template.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  update-project:
    name: Update Project
    uses: hummingbird-project/hummingbird-project-template/.github/workflows/update-project-template.yml@workflows
    with:
      project-name: hummingbird-websocket
      client-id: ${{ secrets.HB_APP_ID }}
      private-key: ${{ secrets.HB_APP_PRIVATE_KEY }}
