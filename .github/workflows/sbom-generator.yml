name: Generate SBOM

on:
  push:
    branches:
    - main
    paths:
    - '**.swift'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-sbom
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  update-project:
    name: Generate SBOM
    uses: hummingbird-project/hummingbird-project-template/.github/workflows/sbom-generator.yml@workflows
    secrets:
      app-client-id: ${{ secrets.HB_APP_ID }}
      app-private-key: ${{ secrets.HB_APP_PRIVATE_KEY }}
