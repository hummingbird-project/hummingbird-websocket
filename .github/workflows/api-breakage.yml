name: API breaking changes

on:
  pull_request:
    branches:
    - main
    paths:
    - '**.swift'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-apibreakage
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-breakage:
    uses: hummingbird-project/hummingbird-project-template/.github/workflows/api-breakage.yml@workflows
